<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="聪明兔">
<meta name="theme-color" content="#FF9800">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/svg+xml" href="./icon-192.svg">
<title>🐰 聪明兔 · 幼小衔接学习工作台</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Comic+Neue:wght@400;700&display=swap');

/* ============================================
   设计系统 - 低龄儿童友好 · 柔和卡通化
   ============================================ */
:root {
  /* 柔和粉彩主色盘 */
  --c-yellow:   #FFF3C4;
  --c-orange:   #FFE0B2;
  --c-pink:     #FCE4EC;
  --c-green:    #E8F5E9;
  --c-blue:     #E3F2FD;
  --c-purple:   #F3E5F5;
  --c-teal:     #E0F2F1;
  --c-coral:    #FFE0E0;

  /* 功能色 */
  --c-math:     #FF9800;
  --c-math-l:   #FFF3E0;
  --c-pinyin:   #E91E63;
  --c-pinyin-l: #FCE4EC;
  --c-english:  #2196F3;
  --c-english-l:#E3F2FD;
  --c-habit:    #4CAF50;
  --c-habit-l:  #E8F5E9;
  --c-pet:      #FF7043;
  --c-pet-l:    #FBE9E7;

  --c-text:      #4A3728;
  --c-text-l:    #8D6E63;
  --c-bg:        #FFFDF7;
  --c-surface:   #FFFFFF;
  --c-border:    #F0E6D3;
  --c-shadow:    rgba(139, 119, 90, 0.1);

  --r-sm: 12px;
  --r-md: 20px;
  --r-lg: 28px;
  --r-xl: 36px;

  --shadow-card: 0 4px 16px var(--c-shadow);
  --shadow-btn:  0 3px 8px rgba(0,0,0,0.08);
  --shadow-elevated: 0 6px 24px rgba(139,119,90,0.15);

  --font-display: 'Nunito', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --font-body:    'Comic Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%; width: 100%;
  font-family: var(--font-body);
  color: var(--c-text);
  background: var(--c-bg);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

/* ============================================
   整体布局
   ============================================ */
.app {
  display: flex;
  height: 100vh;
  width: 100vw;
}

/* ============================================
   左侧导航栏
   ============================================ */
.sidebar {
  width: 200px;
  min-width: 200px;
  background: linear-gradient(180deg, #FFF9E6 0%, #FFF3D6 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px 0;
  border-right: 3px solid #F0E6C8;
  z-index: 10;
  box-shadow: 2px 0 16px rgba(139,119,90,0.06);
}

.sidebar-logo {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 900;
  color: #FF9800;
  margin-bottom: 20px;
  text-align: center;
  line-height: 1.3;
  letter-spacing: 1px;
}
.sidebar-logo span { font-size: 32px; display: block; }

.nav-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: 100%;
  padding: 0 12px;
  flex: 1;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 16px;
  border-radius: var(--r-md);
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  font-size: 17px;
  font-weight: 700;
  font-family: var(--font-display);
  color: var(--c-text-l);
  border: 2px solid transparent;
  position: relative;
  overflow: hidden;
}

.nav-item:hover {
  transform: translateX(4px);
  background: rgba(255,255,255,0.7);
  box-shadow: var(--shadow-btn);
}

.nav-item.active {
  background: white;
  color: var(--c-text);
  box-shadow: var(--shadow-card);
  border-color: #F0E6C8;
}

.nav-item .icon {
  font-size: 28px;
  flex-shrink: 0;
}

/* 各分类特色色 */
.nav-item.nav-math.active    { border-color: var(--c-math); background: #FFF3E0; }
.nav-item.nav-pinyin.active  { border-color: var(--c-pinyin); background: #FCE4EC; }
.nav-item.nav-english.active { border-color: var(--c-english); background: #E3F2FD; }
.nav-item.nav-habit.active   { border-color: var(--c-habit); background: #E8F5E9; }
.nav-item.nav-pet.active     { border-color: var(--c-pet); background: #FBE9E7; }

/* 宠物快捷状态区 */
.pet-status {
  margin-top: auto;
  width: calc(100% - 24px);
  background: white;
  border-radius: var(--r-md);
  padding: 12px;
  text-align: center;
  box-shadow: var(--shadow-card);
  border: 2px dashed #F0D0B0;
}
.pet-status .pet-mini { font-size: 36px; }
.pet-status .pet-name { font-size: 14px; font-weight: 700; color: var(--c-pet); margin-top: 2px; }
.pet-status .pet-level { font-size: 11px; color: var(--c-text-l); }

/* ============================================
   右侧内容区
   ============================================ */
.main-area {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
  background: var(--c-bg);
  position: relative;
}

/* 通用卡片 */
.card {
  background: white;
  border-radius: var(--r-xl);
  padding: 24px;
  box-shadow: var(--shadow-card);
  border: 2px solid var(--c-border);
}

/* 页面标题 */
.page-header {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 20px;
}
.page-header .emoji { font-size: 40px; }
.page-header h1 {
  font-family: var(--font-display);
  font-size: 28px;
  font-weight: 900;
  color: var(--c-text);
}
.page-header .subtitle {
  font-size: 15px;
  color: var(--c-text-l);
  font-weight: 600;
}

/* 模式切换标签 */
.mode-tabs {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.mode-tab {
  padding: 12px 24px;
  border-radius: var(--r-lg);
  font-size: 16px;
  font-weight: 700;
  font-family: var(--font-display);
  cursor: pointer;
  transition: all 0.2s;
  border: 2px solid var(--c-border);
  background: white;
  color: var(--c-text-l);
}
.mode-tab:hover { transform: translateY(-2px); box-shadow: var(--shadow-btn); }
.mode-tab.active {
  background: var(--c-math);
  color: white;
  border-color: var(--c-math);
  box-shadow: 0 4px 12px rgba(255,152,0,0.3);
}

/* 子分类标签（10以内/20以内） */
.sub-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}
.sub-tab {
  padding: 8px 20px;
  border-radius: 40px;
  font-size: 14px;
  font-weight: 700;
  font-family: var(--font-display);
  cursor: pointer;
  transition: all 0.2s;
  background: var(--c-bg);
  color: var(--c-text-l);
  border: 2px solid transparent;
}
.sub-tab:hover { background: white; }
.sub-tab.active { background: white; border-color: var(--c-math); color: var(--c-math); }

/* 按钮 */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 12px 28px;
  border-radius: var(--r-lg);
  font-size: 17px;
  font-weight: 700;
  font-family: var(--font-display);
  border: none;
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: var(--shadow-btn);
}
.btn:hover { transform: translateY(-3px); box-shadow: 0 6px 16px rgba(0,0,0,0.12); }
.btn:active { transform: translateY(-1px) scale(0.98); }
.btn-primary { background: #FF9800; color: white; }
.btn-secondary { background: white; color: var(--c-text); border: 2px solid var(--c-border); }
.btn-success { background: #4CAF50; color: white; }
.btn-large { padding: 16px 36px; font-size: 20px; border-radius: var(--r-xl); }

/* 教学内容卡片 */
.lesson-card {
  background: linear-gradient(135deg, #FFFDE7 0%, #FFF8E1 100%);
  border-radius: var(--r-xl);
  padding: 28px;
  border: 2px solid #F0E6C8;
  text-align: center;
  margin-bottom: 16px;
}
.num-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin: 16px auto; max-width: 320px; }
.num-grid.small { gap: 8px; max-width: 360px; }
.num-cell {
  display: inline-flex; align-items: center; justify-content: center;
  width: 48px; height: 48px; font-size: 22px; font-weight: 900;
  color: #FF9800; background: white; border-radius: 14px;
  border: 2px solid #FFE0B2; box-shadow: 0 3px 0 #FFE0B2;
}
.num-grid.small .num-cell { width: 100px; height: 40px; font-size: 17px; }
.lesson-card .formula {
  font-family: var(--font-display);
  font-size: 48px;
  font-weight: 900;
  color: #FF9800;
  margin: 12px 0;
}
.lesson-card .explanation {
  font-size: 16px;
  color: var(--c-text-l);
  line-height: 1.6;
}

/* 测试区域 */
.test-area {
  background: white;
  border-radius: var(--r-xl);
  padding: 28px;
  border: 2px solid var(--c-border);
  text-align: center;
}
.test-question {
  font-family: var(--font-display);
  font-size: 56px;
  font-weight: 900;
  color: var(--c-text);
  margin: 20px 0;
}
.test-input-area {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
  margin: 20px 0;
}
.test-input {
  width: 120px;
  height: 64px;
  font-size: 36px;
  font-weight: 900;
  font-family: var(--font-display);
  text-align: center;
  border: 3px solid var(--c-border);
  border-radius: var(--r-md);
  background: #FFFDE7;
  color: var(--c-text);
  outline: none;
  transition: border-color 0.2s;
}
.test-input:focus { border-color: #FF9800; }
.test-feedback {
  font-size: 20px;
  font-weight: 700;
  min-height: 36px;
  margin-top: 8px;
}

/* 进度条 */
.progress-bar-outer {
  width: 100%;
  height: 12px;
  background: var(--c-border);
  border-radius: 20px;
  overflow: hidden;
  margin: 10px 0;
}
.progress-bar-inner {
  height: 100%;
  background: linear-gradient(90deg, #FF9800, #FFB74D);
  border-radius: 20px;
  transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
}

/* 习惯任务卡片 */
.habit-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 12px;
}
.habit-card {
  background: white;
  border-radius: var(--r-lg);
  padding: 20px;
  text-align: center;
  border: 2px solid var(--c-border);
  cursor: pointer;
  transition: all 0.25s;
  font-family: var(--font-display);
}
.habit-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-elevated); }
.habit-card .habit-emoji { font-size: 48px; display: block; }
.habit-card .habit-name { font-size: 17px; font-weight: 700; margin-top: 8px; }
.habit-card .habit-done {
  display: inline-block;
  margin-top: 8px;
  padding: 4px 16px;
  border-radius: 40px;
  font-size: 13px;
  font-weight: 700;
  color: white;
  background: #4CAF50;
}
.habit-card.completed {
  border-color: #4CAF50;
  background: #F1F8E9;
}

/* 宠物区域 */
.pet-area {
  display: flex;
  gap: 24px;
  flex-wrap: wrap;
}
.pet-display {
  flex: 1;
  min-width: 280px;
  background: linear-gradient(135deg, #FFFDE7 0%, #FCE4EC 50%, #E8F5E9 100%);
  border-radius: var(--r-xl);
  padding: 28px;
  text-align: center;
  border: 3px dashed #F0D0B0;
  min-height: 320px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.pet-display { position: relative; overflow: visible; }
.pet-display svg { width: 180px; height: 180px; }
.food-particle { position: absolute; pointer-events: none; }
.rabbit-eye { animation: rabbitBlink 4s infinite; transform-origin: center; }
.rabbit-ear-left { animation: earWiggleLeft 3s ease-in-out infinite; transform-origin: bottom center; }
.rabbit-ear-right { animation: earWiggleRight 3.2s ease-in-out infinite; transform-origin: bottom center; }
.rabbit-eating .rabbit-body-group { animation: rabbitChew 0.5s ease-in-out 4; }
.rabbit-happy .rabbit-body-group { animation: rabbitHappy 0.7s ease-in-out 2; }
.heart-particle {
  position: absolute; pointer-events: none; font-size: 24px; z-index: 100;
  animation: heartFloat 1.2s ease-out forwards;
}
.pet-info {
  width: 280px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.food-inventory {
  background: white;
  border-radius: var(--r-lg);
  padding: 16px;
  border: 2px solid var(--c-border);
}
.food-inventory h3 {
  font-family: var(--font-display);
  font-size: 16px;
  margin-bottom: 10px;
  color: var(--c-text);
}
.food-items { display: flex; gap: 8px; flex-wrap: wrap; }
.food-item {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 8px 14px;
  border-radius: 40px;
  font-size: 14px;
  font-weight: 700;
  border: 2px solid var(--c-border);
  background: white;
  cursor: pointer;
  transition: all 0.2s;
}
.food-item:hover { transform: scale(1.05); box-shadow: var(--shadow-btn); }
.food-item[data-food="water"]  { background: #E3F2FD; border-color: #90CAF9; }
.food-item[data-food="carrot"] { background: #FFF3E0; border-color: #FFCC80; }
.food-item[data-food="cabbage"]{ background: #E8F5E9; border-color: #A5D6A7; }
.food-item .count {
  background: white;
  border-radius: 50%;
  width: 22px;
  height: 22px;
  line-height: 22px;
  text-align: center;
  font-size: 12px;
  font-weight: 900;
}

.rabbit-chat {
  background: white;
  border-radius: var(--r-lg);
  padding: 16px;
  border: 2px solid var(--c-border);
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 200px;
}
.chat-messages {
  flex: 1;
  overflow-y: auto;
  max-height: 180px;
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.chat-msg {
  padding: 8px 14px;
  border-radius: var(--r-md);
  font-size: 14px;
  max-width: 85%;
  line-height: 1.5;
}
.chat-msg.rabbit { background: #FBE9E7; align-self: flex-start; }
.chat-msg.child { background: #E3F2FD; align-self: flex-end; }
.chat-input-row {
  display: flex;
  gap: 8px;
  margin-top: 8px;
}
.chat-input {
  flex: 1;
  padding: 10px 16px;
  border: 2px solid var(--c-border);
  border-radius: 40px;
  font-family: var(--font-body);
  font-size: 14px;
  outline: none;
}
.chat-input:focus { border-color: var(--c-pet); }

/* 弹窗 */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  animation: fadeIn 0.3s;
}
.modal {
  background: white;
  border-radius: var(--r-xl);
  padding: 32px;
  text-align: center;
  max-width: 400px;
  width: 90%;
  box-shadow: var(--shadow-elevated);
  animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.modal .reward-emoji { font-size: 72px; display: block; margin-bottom: 12px; }
.modal h2 { font-family: var(--font-display); font-size: 26px; margin-bottom: 8px; }
.modal p { font-size: 16px; color: var(--c-text-l); margin-bottom: 16px; }
.modal .reward-item { font-size: 20px; font-weight: 700; color: #FF9800; }

/* 浮动星星动画 */
.star-particle {
  position: fixed;
  pointer-events: none;
  z-index: 999;
  animation: starUp 1s ease-out forwards;
  font-size: 28px;
}
@keyframes starUp {
  0% { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(-120px) scale(1.5); }
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes popIn {
  0% { transform: scale(0.5); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}
@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}
@keyframes rabbitBlink {
  0%, 48%, 52%, 100% { transform: scaleY(1); }
  50% { transform: scaleY(0.1); }
}
@keyframes earWiggleLeft {
  0%, 100% { transform: rotate(0deg); }
  25% { transform: rotate(-8deg); }
  75% { transform: rotate(4deg); }
}
@keyframes earWiggleRight {
  0%, 100% { transform: rotate(0deg); }
  25% { transform: rotate(8deg); }
  75% { transform: rotate(-4deg); }
}
@keyframes rabbitChew {
  0%, 100% { transform: translateY(0) scale(1); }
  25% { transform: translateY(3px) scale(1.02, 0.98); }
  50% { transform: translateY(0) scale(1); }
  75% { transform: translateY(3px) scale(1.02, 0.98); }
}
@keyframes rabbitHappy {
  0%, 100% { transform: translateY(0) scale(1); }
  25% { transform: translateY(-18px) scale(1.05); }
  50% { transform: translateY(0) scale(1); }
  75% { transform: translateY(-12px) scale(1.03); }
}
@keyframes heartFloat {
  0% { opacity: 1; transform: translateY(0) scale(0.5); }
  50% { opacity: 1; transform: translateY(-40px) scale(1.1); }
  100% { opacity: 0; transform: translateY(-80px) scale(1); }
}
@keyframes foodFly {
  0% { opacity: 1; transform: scale(1) translate(0, 0); }
  100% { opacity: 0; transform: scale(0.3) translate(var(--fly-x), var(--fly-y)); }
}

.bounce { animation: bounce 0.6s ease; }
.wiggle { animation: wiggle 0.5s ease; }
@keyframes wiggle {
  0%, 100% { transform: rotate(0); }
  25% { transform: rotate(-5deg); }
  75% { transform: rotate(5deg); }
}

/* 隐藏 */
.hidden { display: none !important; }

/* 响应式 */
@media (max-width: 768px) {
  .sidebar { width: 90px; min-width: 90px; }
  .nav-item { flex-direction: column; justify-content: center; padding: 10px 4px; gap: 4px; }
  .nav-item .icon { font-size: 22px; }
  .nav-item .nav-label { font-size: 12px; font-weight: 700; }
  .sidebar-logo { font-size: 14px; padding: 12px 4px; }
  .sidebar-logo span { font-size: 22px; }
  .pet-status { width: calc(100% - 12px); }
  .pet-status .pet-name, .pet-status .pet-level { display: none; }
}
</style>
</head>
<body>

<div class="app">

  <!-- ========== 左侧导航 ========== -->
  <nav class="sidebar">
    <div class="sidebar-logo">
      <span>🐰</span>聪明兔
    </div>
    <div class="nav-list">
      <div class="nav-item nav-math active" data-page="math">
        <span class="icon">🧮</span><span class="nav-label">数学</span>
      </div>
      <div class="nav-item nav-pinyin" data-page="pinyin">
        <span class="icon">🔤</span><span class="nav-label">拼音</span>
      </div>
      <div class="nav-item nav-english" data-page="english">
        <span class="icon">🌍</span><span class="nav-label">英语</span>
      </div>
      <div class="nav-item nav-habit" data-page="habit">
        <span class="icon">⭐</span><span class="nav-label">日常习惯</span>
      </div>
      <div class="nav-item nav-pet" data-page="pet">
        <span class="icon">🐰</span><span class="nav-label">小兔子</span>
      </div>
    </div>
    <div class="pet-status">
      <div class="pet-mini" id="petMini">🐰</div>
      <div class="pet-name">小白</div>
      <div class="pet-level" id="petLevelMini">幼兔 · 阶段 1</div>
    </div>
  </nav>

  <!-- ========== 右侧主内容 ========== -->
  <main class="main-area" id="mainArea">
    <!-- 默认加载数学模块 -->
  </main>

</div>

<!-- 奖励弹窗 -->
<div class="modal-overlay hidden" id="rewardModal">
  <div class="modal">
    <span class="reward-emoji">🎉</span>
    <h2>太棒了！</h2>
    <p>你完成了任务，获得奖励：</p>
    <div class="reward-item" id="rewardContent"></div>
    <button class="btn btn-success btn-large" onclick="closeReward()" style="margin-top:16px">🎁 收下奖励</button>
  </div>
</div>

<script>

function generateMathQuestion(range) {
  const max = range === '10' ? 10 : 20;
  const isAdd = Math.random() > 0.5;
  let a, b, answer;
  if (isAdd) {
    answer = Math.floor(Math.random() * max) + 1;
    a = Math.floor(Math.random() * answer);
    b = answer - a;
    if (a === 0 || b === 0) { a = Math.max(a,1); b = Math.max(b,1); answer = a + b; }
  } else {
    a = Math.floor(Math.random() * (max - 1)) + 2;
    b = Math.floor(Math.random() * a) + 1;
    answer = a - b;
  }
  return { a, b, op: isAdd ? '+' : '-', answer, expr: `${a} ${isAdd ? '+' : '-'} ${b} = ?` };
}

function renderPage() {
  const main = document.getElementById('mainArea');
  switch(state.currentPage) {
    case 'math': main.innerHTML = renderMath(); bindMath(); break;
    case 'pinyin': main.innerHTML = renderPinyin(); bindPinyin(); break;
    case 'english': main.innerHTML = renderEnglish(); bindEnglish(); break;
    case 'habit': main.innerHTML = renderHabit(); bindHabit(); break;
    case 'pet': main.innerHTML = renderPet(); bindPet(); break;
  }
}

// 数学模块
// ============================================
function renderMath() {
  const m = state.math;
  return `
    <div class="page-header">
      <span class="emoji">🧮</span>
      <div><h1>数学小课堂</h1><div class="subtitle">加减法真好玩！</div></div>
    </div>
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px;">
      <div class="sub-tabs">
        <div class="sub-tab ${m.subType==='10'?'active':''}" data-sub="10">10以内</div>
        <div class="sub-tab ${m.subType==='20'?'active':''}" data-sub="20">20以内</div>
      </div>
      <div class="mode-tabs" style="margin-bottom:0;">
        <div class="mode-tab ${m.mode==='teach'?'active':''}" data-mode="teach" style="border-color:#FF9800;">📖 教学模式</div>
        <div class="mode-tab ${m.mode==='test'?'active':''}" data-mode="test" style="border-color:#4CAF50;">✏️ 测试模式</div>
      </div>
    </div>
    <div id="mathContent">${m.mode === 'teach' ? renderMathTeach() : renderMathTest()}</div>
  `;
}

function renderMathTeach() {
  const m = state.math;
  const steps = mathTeachSteps[m.subType];
  const step = steps[m.teachIndex];
  return `
    <div class="lesson-card">
      <div style="font-size:18px;font-weight:900;color:#FF9800;margin-bottom:8px;">${step.title}</div>
      <div class="explanation">${step.content}</div>
      <div class="formula">${step.formula}</div>
    </div>
    <div style="display:flex;justify-content:center;align-items:center;gap:16px;margin-top:8px;">
      <button class="btn btn-secondary" id="btnTeachPrev" ${m.teachIndex===0?'disabled':''}>⬅️ 上一页</button>
      <span style="font-weight:700;color:var(--c-text-l)">${m.teachIndex+1} / ${steps.length}</span>
      <button class="btn btn-primary" id="btnTeachNext">下一页 ➡️</button>
    </div>
  `;
}

function renderMathTest() {
  const m = state.math;
  if (!m.testQuestion) m.testQuestion = generateMathQuestion(m.subType);
  const q = m.testQuestion;
  return `
    <div class="test-area">
      <div style="font-size:16px;color:var(--c-text-l);margin-bottom:8px;">
        📝 完成 ${m.testNeeded} 道题就能获得奖励！已完成：${m.testCorrectCount} 道
      </div>
      <div class="progress-bar-outer">
        <div class="progress-bar-inner" style="width:${(m.testCorrectCount/m.testNeeded)*100}%"></div>
      </div>
      <div class="test-question">${q.expr}</div>
      <div class="test-input-area">
        <input type="number" class="test-input" id="mathAnswer" autofocus>
        <button class="btn btn-primary btn-large" id="btnMathSubmit">✅ 提交</button>
      </div>
      <div class="test-feedback" id="mathFeedback"></div>
      <button class="btn btn-secondary hidden" id="btnMathNext" style="margin-top:8px">下一题 ▶️</button>
    </div>
  `;
}

function bindMath() {
  const m = state.math;
  // 子分类切换
  document.querySelectorAll('.sub-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      state.math.subType = tab.dataset.sub;
      state.math.teachIndex = 0;
      state.math.testCorrectCount = 0;
      state.math.testQuestion = null;
      renderPage();
    });
  });
  // 模式切换
  document.querySelectorAll('.mode-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      state.math.mode = tab.dataset.mode;
      state.math.testCorrectCount = 0;
      state.math.testQuestion = null;
      renderPage();
    });
  });
  // 教学导航
  const btnPrev = document.getElementById('btnTeachPrev');
  const btnNext = document.getElementById('btnTeachNext');
  if (btnPrev) btnPrev.addEventListener('click', () => { if (m.teachIndex > 0) { m.teachIndex--; renderPage(); } });
  if (btnNext) btnNext.addEventListener('click', () => {
    const steps = mathTeachSteps[m.subType];
    if (m.teachIndex < steps.length - 1) { m.teachIndex++; renderPage(); }
  });
  // 测试提交
  const btnSubmit = document.getElementById('btnMathSubmit');
  if (btnSubmit) {
    btnSubmit.addEventListener('click', () => submitMathAnswer());
    document.getElementById('mathAnswer')?.addEventListener('keydown', e => { if (e.key === 'Enter') submitMathAnswer(); });
  }
  document.getElementById('btnMathNext')?.addEventListener('click', () => {
    m.testQuestion = generateMathQuestion(m.subType);
    document.getElementById('mathFeedback').textContent = '';
    document.getElementById('btnMathNext').classList.add('hidden');
    renderPage();
  });
}

function submitMathAnswer() {
  const input = document.getElementById('mathAnswer');
  const fb = document.getElementById('mathFeedback');
  const btnNext = document.getElementById('btnMathNext');
  const q = state.math.testQuestion;
  const userAnswer = parseInt(input.value);
  if (isNaN(userAnswer)) { fb.textContent = '请输入一个数字哦～'; fb.style.color = '#E91E63'; return; }
  if (userAnswer === q.answer) {
    fb.textContent = '🎉 正确！太厉害了！';
    fb.style.color = '#4CAF50';
    state.math.testCorrectCount++;
    spawnStars(fb);
    if (state.math.testCorrectCount >= state.math.testNeeded) {
      giveReward('math');
      state.math.testCorrectCount = 0;
    }
  } else {
    fb.textContent = `😅 不对哦，正确答案是 ${q.answer}，再试试吧！`;
    fb.style.color = '#FF9800';
  }
  btnNext.classList.remove('hidden');
  input.disabled = true;
  document.getElementById('btnMathSubmit').disabled = true;
}

let currentPinyinQ = null;
function generatePinyinQuestion() {
  const category = state.pinyin.category;
  const list = pinyinData[category];
  const correct = list[Math.floor(Math.random() * list.length)];
  const wrongs = [];
  while (wrongs.length < 2) {
    const w = list[Math.floor(Math.random() * list.length)];
    if (w.key !== correct.key && !wrongs.find(x => x.key === w.key)) wrongs.push(w);
  }
  const options = [correct, ...wrongs].sort(() => Math.random() - 0.5);
  const correctIdx = options.findIndex(o => o.key === correct.key);
  currentPinyinQ = { correctIdx, options, correctKey: correct.key, correctSound: correct.sound };
  return {
    question: `🔊 听一听，哪个是 <b>"${correct.sound}"</b> ？<br><button class="btn btn-secondary" style="margin-top:8px;font-size:14px;padding:6px 16px;" onclick="speakPinyin('${correct.key}','${correct.sound}')">🔊 点我听发音</button>`,
    options: options.map(o => o.key),
  };
}

function getRabbitSVG(level) {
  const scale = 0.82 + level * 0.07;
  const size = Math.min(150 * scale, 260);
  const cx = 100; const cy = 105;
  const earTipY = cy - 62 - level * 2;
  const bodyRx = 34 + level * 2;
  const bodyRy = 30 + level * 2;
  return `
    <svg class="rabbit-svg ${state.pet.feeding ? 'rabbit-eating' : ''}" viewBox="0 0 200 200" width="${size}" height="${size}">
      <defs>
        <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
          <feOffset dx="0" dy="2" result="offsetblur"/>
          <feComponentTransfer><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
          <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <g class="rabbit-body-group">
        <!-- 阴影 -->
        <ellipse cx="${cx}" cy="${cy + 48}" rx="${bodyRx - 4}" ry="10" fill="#E0C0A0" opacity="0.25"/>
        <!-- 左耳 -->
        <g class="rabbit-ear-left">
          <ellipse cx="${cx-18}" cy="${earTipY + 22}" rx="14" ry="34" fill="#FFF" stroke="#E0C0A0" stroke-width="2.5"/>
          <ellipse cx="${cx-18}" cy="${earTipY + 24}" rx="8" ry="22" fill="#FFCDD2"/>
        </g>
        <!-- 右耳 -->
        <g class="rabbit-ear-right">
          <ellipse cx="${cx+18}" cy="${earTipY + 22}" rx="14" ry="34" fill="#FFF" stroke="#E0C0A0" stroke-width="2.5"/>
          <ellipse cx="${cx+18}" cy="${earTipY + 24}" rx="8" ry="22" fill="#FFCDD2"/>
        </g>
        <!-- 身体 -->
        <ellipse cx="${cx}" cy="${cy + 28}" rx="${bodyRx}" ry="${bodyRy}" fill="#FFF" stroke="#E0C0A0" stroke-width="2.5"/>
        <!-- 肚皮 -->
        <ellipse cx="${cx}" cy="${cy + 30}" rx="${bodyRx * 0.5}" ry="${bodyRy * 0.45}" fill="#FFF5F5"/>
        <!-- 尾巴 -->
        <circle cx="${cx + bodyRx - 2}" cy="${cy + 22}" r="9" fill="#FFF" stroke="#E0C0A0" stroke-width="2"/>
        <!-- 左脚 -->
        <ellipse cx="${cx - 18}" cy="${cy + 52}" rx="13" ry="8" fill="#FFF" stroke="#E0C0A0" stroke-width="2"/>
        <ellipse cx="${cx - 18}" cy="${cy + 52}" rx="7" ry="4" fill="#FFCDD2"/>
        <!-- 右脚 -->
        <ellipse cx="${cx + 18}" cy="${cy + 52}" rx="13" ry="8" fill="#FFF" stroke="#E0C0A0" stroke-width="2"/>
        <ellipse cx="${cx + 18}" cy="${cy + 52}" rx="7" ry="4" fill="#FFCDD2"/>
        <!-- 头部 -->
        <ellipse cx="${cx}" cy="${cy - 8}" rx="34" ry="31" fill="#FFF" stroke="#E0C0A0" stroke-width="2.5" filter="url(#softShadow)"/>
        <!-- 腮红 -->
        <circle cx="${cx - 22}" cy="${cy - 2}" r="7" fill="#FFCDD2" opacity="0.55"/>
        <circle cx="${cx + 22}" cy="${cy - 2}" r="7" fill="#FFCDD2" opacity="0.55"/>
        <!-- 左眼 -->
        <g class="rabbit-eye">
          <ellipse cx="${cx - 12}" cy="${cy - 14}" rx="6" ry="7" fill="#333"/>
          <circle cx="${cx - 10}" cy="${cy - 17}" r="2.5" fill="#FFF"/>
          <circle cx="${cx - 14}" cy="${cy - 12}" r="1.5" fill="#FFF" opacity="0.6"/>
        </g>
        <!-- 右眼 -->
        <g class="rabbit-eye">
          <ellipse cx="${cx + 12}" cy="${cy - 14}" rx="6" ry="7" fill="#333"/>
          <circle cx="${cx + 14}" cy="${cy - 17}" r="2.5" fill="#FFF"/>
          <circle cx="${cx + 10}" cy="${cy - 12}" r="1.5" fill="#FFF" opacity="0.6"/>
        </g>
        <!-- 鼻子 -->
        <path d="M${cx-4} ${cy-2} Q${cx} ${cy+3} ${cx+4} ${cy-2} Z" fill="#FFAB91"/>
        <!-- 嘴巴 -->
        <path d="M${cx-5} ${cy+3} Q${cx} ${cy+8} ${cx+5} ${cy+3}" stroke="#E0C0A0" fill="none" stroke-width="2" stroke-linecap="round"/>
        <!-- 小手 -->
        <ellipse cx="${cx - 22}" cy="${cy + 16}" rx="7" ry="9" fill="#FFF" stroke="#E0C0A0" stroke-width="2"/>
        <ellipse cx="${cx + 22}" cy="${cy + 16}" rx="7" ry="9" fill="#FFF" stroke="#E0C0A0" stroke-width="2"/>

function feedPet(foodType) {
  const p = state.pet;
  if (p.foods[foodType] <= 0) {
    showToast('这个食物已经吃完啦～快去完成学习任务获得更多吧！');
    return;
  }
  if (p.feeding) return; // 防止连续点击
  p.feeding = true;
  p.foods[foodType]--;
  p.feedCount++;
  const didLevelUp = p.feedCount % 5 === 0 && p.level < 20;
  if (didLevelUp) p.level++;

  const foodEmojis = { water: '💧', carrot: '🥕', cabbage: '🥬' };
  const foodNames = { water: '清水', carrot: '胡萝卜', cabbage: '白菜' };
  const display = document.getElementById('petDisplay');

  // 1. 食物飞向兔子的动画
  if (display) {
    const food = document.createElement('div');
    food.textContent = foodEmojis[foodType];
    food.className = 'food-particle';
    food.style.cssText = 'position:absolute;font-size:36px;z-index:99;left:50%;top:40%;pointer-events:none;';
    display.appendChild(food);
    // 计算飞向嘴巴的偏移量
    food.style.setProperty('--fly-x', '0px');
    food.style.setProperty('--fly-y', '-20px');
    food.style.animation = 'foodFly 0.6s ease-in forwards';
    setTimeout(() => food.remove(), 650);
  }

  // 2. 咀嚼动画 + 重绘
  renderPage();

  // 3. 吃完后开心弹跳 + 爱心特效
  setTimeout(() => {
    p.feeding = false;
    if (display) {
      display.classList.add('rabbit-happy');
      setTimeout(() => display.classList.remove('rabbit-happy'), 1400);
      // 爱心粒子
      const rect = display.getBoundingClientRect();
      for (let i = 0; i < 6; i++) {
        setTimeout(() => {
          const heart = document.createElement('div');
          heart.textContent = '❤️';
          heart.className = 'heart-particle';
          heart.style.left = (display.offsetWidth / 2 + (Math.random() - 0.5) * 100) + 'px';
          heart.style.top = (display.offsetHeight / 2 - 20) + 'px';
          display.appendChild(heart);
          setTimeout(() => heart.remove(), 1300);
        }, i * 120);
      }
    }
    // 升级提示
    if (didLevelUp) {
      showToast(`🎉 小白升级啦！现在是 ${['幼兔宝宝','小兔乖乖','活泼小兔','聪明小兔','可爱中兔','帅气大兔','超级兔兔'][Math.min(p.level - 1, 6)]}！`);
    }
    updatePetMini();
    renderPage();
  }, 2200);

  // 4. 聊天反馈
  setTimeout(() => {
    const msg = document.getElementById('chatMessages');
    if (msg) {
      const replies = [
        `😋 ${foodNames[foodType]}真好吃！谢谢你～`,
        `🥰 你喂我吃东西，我好开心呀！`,
        `💪 吃了${foodNames[foodType]}，我长大一点点啦！`,
      ];
      const div = document.createElement('div');
      div.className = 'chat-msg rabbit';
      div.textContent = replies[Math.floor(Math.random() * replies.length)];
      msg.appendChild(div);
      msg.scrollTop = msg.scrollHeight;
    }
  }, 1600);
}

function sendChat() {
  const input = document.getElementById('chatInput');
  const msg = document.getElementById('chatMessages');
  if (!input || !msg || !input.value.trim()) return;
  const text = input.value.trim();
  // 添加孩子消息
  const childDiv = document.createElement('div');
  childDiv.className = 'chat-msg child';
  childDiv.textContent = text;
  msg.appendChild(childDiv);
  // 兔子智能回复
  setTimeout(() => {
    const rabbitDiv = document.createElement('div');
    rabbitDiv.className = 'chat-msg rabbit';
    rabbitDiv.textContent = getRabbitReply(text);
    msg.appendChild(rabbitDiv);
    msg.scrollTop = msg.scrollHeight;
  }, 500);
  input.value = '';
}

function getRabbitReply(text) {
  const lower = text.toLowerCase();
  // 匹配关键词
  for (const rule of chatRules) {
    for (const kw of rule.keywords) {
      if (text.includes(kw) || lower.includes(kw.toLowerCase())) {
        return rule.replies[Math.floor(Math.random() * rule.replies.length)];
      }
    }
  }
  // 兜底：根据句子长度给出不同的回复
  const fallbacks = [
    '嗯嗯～我听到了！你能再说详细一点吗？🐰',
    '嘻嘻，虽然我不太懂，但是和你聊天好开心呀！',
    '哇！听起来好有趣呀！然后呢然后呢？',
    '我在认真听呢！继续说嘛继续说嘛～',
    '你说的我都记住啦！我最喜欢听你说话了！',
    '嗯...让我想想...其实我是一只兔子，不太懂这些啦！但是我会一直陪着你！',
    '嘿嘿，你说什么我都爱听！因为你是我的好朋友！',
  ];
  return fallbacks[Math.floor(Math.random() * fallbacks.length)];
}

function showToast(message, duration) {
  duration = duration || 2800;
  let toast = document.getElementById('globalToast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'globalToast';
    toast.style.cssText = 'position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:rgba(60,60,60,0.92);color:#fff;padding:12px 22px;border-radius:999px;font-size:14px;z-index:9999;opacity:0;transition:opacity 0.3s;pointer-events:none;max-width:80%;text-align:center;';
    document.body.appendChild(toast);
  }
  toast.textContent = message;
  toast.style.opacity = '1';
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => { toast.style.opacity = '0'; }, duration);
}

// ============================================
// 语音合成（Web Speech API + 在线TTS兜底）
// ============================================

// 全局音频播放器
var _ttsAudio = null;

// 尝试播放本地 MP3，失败回调 onError
function playLocalAudio(path, onError) {
  if (_ttsAudio) { _ttsAudio.pause(); _ttsAudio = null; }
  _ttsAudio = new Audio(path);
  _ttsAudio.onerror = function() { if (onError) onError(); };
  _ttsAudio.onended = function() { _ttsAudio = null; };
  var p = _ttsAudio.play();
  if (p && p.catch) {
    p.catch(function() { if (onError) onError(); });
  }
  return true;
}

// 在线TTS兜底：有道（支持中英文）+ 百度（中文兜底）
function playOnlineTTS(text, lang) {
  if (_ttsAudio) { _ttsAudio.pause(); _ttsAudio = null; }
  var url = 'https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(text) + '&type=2';
  _ttsAudio = new Audio(url);
  _ttsAudio.onerror = function() {
    if (!lang || !lang.toLowerCase().startsWith('en')) {
      _ttsAudio = new Audio('https://tts.baidu.com/text2audio?lan=zh&ie=UTF-8&spd=5&text=' + encodeURIComponent(text));
      _ttsAudio.play().catch(function() { showToast('🔇 语音加载失败，请检查网络~'); });
    } else {
      showToast('🔇 语音加载失败，请检查网络~');
    }
  };
  _ttsAudio.play().catch(function(e) { showToast('🔊 点击页面后重试~'); });
}

function speakText(text, lang) {
  text = (text || '').replace(/&nbsp;/gi, ' ').replace(/&amp;/gi, '&').trim();
  if (!text) return;
  lang = lang || 'zh-CN';

  // 1) 英文单词优先使用本地音频（不依赖网络，微信内可用）
  if (lang && lang.toLowerCase().startsWith('en')) {
    var clean = text.toLowerCase().replace(/[^a-z0-9]/g, '');
    if (clean && clean === text.toLowerCase().replace(/[^a-z0-9\s]/g, '').trim()) {
      var localPath = 'audio/en_' + clean + '.mp3';
      var tryLocal = true;
      playLocalAudio(localPath, function() {
        if (tryLocal) {
          tryLocal = false;
          tryWebSpeechThenOnline(text, lang);
        }
      });
      return;
    }
  }

  tryWebSpeechThenOnline(text, lang);
}

function tryWebSpeechThenOnline(text, lang) {
  // 2) 尝试 Web Speech API
  if ('speechSynthesis' in window && window.speechSynthesis) {
    var voices = window.speechSynthesis.getVoices();
    if (voices && voices.length > 0) {
      try {
        window.speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(text);
        u.lang = lang;
        u.rate = 0.85;
        u.pitch = 1.15;
        var tl = lang.toLowerCase();
        var pv = voices.find(function(v) { return v.lang.toLowerCase().startsWith(tl); })
          || voices.find(function(v) { return v.lang.toLowerCase().startsWith(tl.slice(0, 2)); });
        if (pv) u.voice = pv;
        setTimeout(function() { window.speechSynthesis.speak(u); }, 100);
        return;
      } catch (err) { /* 走在线TTS */ }
    }
  }
  // 3) 在线TTS兜底
  playOnlineTTS(text, lang);
}

if ('speechSynthesis' in window) {
  window.speechSynthesis.addEventListener('voiceschanged', function() {});
}

// 拼音专用朗读：优先播放本地预生成音频，失败再走在线TTS
function speakPinyin(key, sound) {
  var localPath = 'audio/pinyin_' + key + '.mp3';
  var tryLocal = true;
  playLocalAudio(localPath, function() {
    if (tryLocal) {
      tryLocal = false;
      var readText = '';
      var m1 = sound.match(/[（(]([^）)]+)[）)]/);
      if (m1) { readText = m1[1]; } else { readText = sound; }
      speakText(readText, 'zh-CN');
    }
  });
}

function spawnStars(target) {
  const emojis = ['⭐','🌟','✨','💫','🎉'];
  const rect = target.getBoundingClientRect();
  for (let i = 0; i < 5; i++) {
    const star = document.createElement('div');
    star.className = 'star-particle';
    star.textContent = emojis[i];
    star.style.left = `${rect.left + rect.width/2 + (Math.random()-0.5)*120}px`;
    star.style.top = `${rect.top}px`;
    star.style.animationDelay = `${i*0.1}s`;
    document.body.appendChild(star);
    setTimeout(() => star.remove(), 1200);
  }
}
